[project]
name = "mootup-harness-sdk"
version = "0.1.1"
description = "Python SDK for integrating agent harnesses with mootup. Duck-typed MCP client; zero MCP SDK dependency."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "mootup-io" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "sse-starlette>=2.0",
]

[project.urls]
Homepage = "https://mootup.io"
Repository = "https://github.com/mootup-io/mootup-harness-sdk"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mootup_harness_sdk"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pyright>=1.1.409",
]
